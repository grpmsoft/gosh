name: Bug Report
description: Report a bug to help us improve GoSh
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Type '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include terminal output if applicable.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS 15 (Sequoia)
        - macOS 14 (Sonoma)
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Fedora 41
        - Arch Linux
        - Other Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: terminal
    attributes:
      label: Terminal Emulator
      options:
        - Windows Terminal
        - MSYS2 / Git Bash (mintty)
        - PowerShell
        - CMD
        - iTerm2
        - Terminal.app
        - GNOME Terminal
        - Alacritty
        - WezTerm
        - Kitty
        - Konsole
        - Other
    validations:
      required: true

  - type: dropdown
    id: ui-mode
    attributes:
      label: UI Mode
      description: Which GoSh UI mode were you using?
      options:
        - Classic
        - Warp
        - Compact
        - Chat
        - N/A
    validations:
      required: true

  - type: input
    id: gosh-version
    attributes:
      label: GoSh Version
      description: "Run `gosh --version` to get this."
      placeholder: "e.g. 0.1.0-beta.8"
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: "Run `go version` to get this."
      placeholder: "e.g. 1.25.0"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or log output.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this bug has not been reported before.
          required: true
        - label: I am using the latest version of GoSh.
          required: false
