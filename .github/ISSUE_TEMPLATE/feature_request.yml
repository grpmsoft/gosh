name: Feature Request
description: Suggest a new feature or improvement for GoSh
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please fill out the form below.

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which area of GoSh does this relate to?
      options:
        - Shell Core (command execution, pipelines, redirections)
        - Built-in Commands (cd, pwd, echo, export, etc.)
        - UI / TUI (modes, rendering, prompt)
        - History (search, persistence, navigation)
        - Scripting (shell scripts, POSIX compatibility)
        - Tab Completion
        - Configuration
        - Cross-Platform Compatibility
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is this related to a problem? Describe the pain point.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important — affects my workflow
        - Critical — blocking my usage
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references (e.g. how other shells handle this).
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this feature has not been requested before.
          required: true
